[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-assessor"
version = "1.0.0"
description = "TerraWatch Fire Evidence Assessor: advisory fire/smoke/authenticity triage for single photographs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10", "pydantic>=2"]

[project.optional-dependencies]
model = ["torch>=2.1", "open_clip_torch>=2.24"]
heic = ["pillow-heif"]
dev = ["pytest"]

[project.scripts]
fire-assess = "fire_assessor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
